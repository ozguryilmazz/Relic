name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1
  DB_URL: https://relic-502f6-default-rtdb.europe-west1.firebasedatabase.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sürüm numarası
        id: ver
        run: |
          CODE=${{ github.run_number }}
          NAME="0.1.${CODE}"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          sed -i "s/^const CODE := .*/const CODE := $CODE/" scripts/version.gd
          sed -i "s/^const NAME := .*/const NAME := \"$NAME\"/" scripts/version.gd
          sed -i "s/^version\/code=.*/version\/code=$CODE/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$NAME\"/" export_presets.cfg

      - name: Godot ve export şablonlarını kur
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f *.zip *.tpz

      - name: Godot editör ayarları (Android SDK / Java)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.5.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_ALIAS" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret yok. Geçici anahtar kullanılıyor; bu APK sonraki sürümlerin üstüne güncellenemez."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/temp.keystore -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp1234 -keypass temp1234 -dname "CN=Relic Temp"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/temp.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=temp" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=temp1234" >> $GITHUB_ENV
          fi

      - name: Projeyi içe aktar
        run: timeout 600 godot --headless --path . --import || true

      - name: APK derle
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/Relic.apk
          test -f build/Relic.apk
          mv build/Relic.apk build/Relic-${{ steps.ver.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Relic-${{ steps.ver.outputs.name }}
          path: build/*.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Relic ${{ steps.ver.outputs.name }}
          body: "Otomatik derleme: ${{ github.sha }}"
          files: build/*.apk
          make_latest: true

      - name: Firebase'e son sürümü yaz
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: |
          if [ -z "$FIREBASE_DB_SECRET" ]; then
            echo "::warning::FIREBASE_DB_SECRET yok, sürüm bilgisi Firebase'e yazılmadı."
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.name }}"
          curl -sf -X PUT "$DB_URL/config/latest.json?auth=$FIREBASE_DB_SECRET" \
            -d "{\"code\": ${{ steps.ver.outputs.code }}, \"name\": \"${{ steps.ver.outputs.name }}\", \"url\": \"$URL\"}"
